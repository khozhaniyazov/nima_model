name: Tests and Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    env:
      USE_DATABASE: 'false'
      OPENAI_API_KEY: 'test'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps for manim build
        # manim depends on manimpango, which is built from source on Linux and
        # requires pkg-config + pangocairo headers; without these, pip install
        # of the requirements file fails before pytest even runs.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libpango1.0-dev \
            libcairo2-dev \
            ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run pytest
        # Heavy live-backend reliability harnesses live under scripts/ and are
        # not collected here.
        run: pytest tests/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff
        # Config (selected rules, ignores, excluded vendored dirs) lives in
        # pyproject.toml so local and CI runs stay in sync.
        run: ruff check .

  pipeline-modes:
    name: Pipeline mode smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [DRAFT, FAST, FULL]
    env:
      USE_DATABASE: 'false'
      OPENAI_API_KEY: 'test'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps for manim build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libpango1.0-dev \
            libcairo2-dev \
            ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify config loads in ${{ matrix.mode }} mode
        env:
          DRAFT_PIPELINE: ${{ matrix.mode == 'DRAFT' }}
          FAST_PIPELINE: ${{ matrix.mode == 'FAST' }}
        run: |
          python -c "import config; print(f'DRAFT={config.DRAFT_PIPELINE}, FAST={config.FAST_PIPELINE}')"

  benchmark:
    name: Benchmark (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      USE_DATABASE: 'false'
      OPENAI_API_KEY: 'test'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system deps for manim build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libpango1.0-dev \
            libcairo2-dev \
            ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run benchmark
        run: python scripts/benchmark.py

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
