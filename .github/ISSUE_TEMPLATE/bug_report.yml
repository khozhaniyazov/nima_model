name: Bug report
description: Something in NIMA broke or behaved unexpectedly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report! Please fill out as much as you can — even partial information is useful.

        **Security issues:** do NOT report those here. See [SECURITY.md](../../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what did you actually see?
      placeholder: |
        1. Started the server with `python app.py`
        2. POSTed to `/api/generate` with prompt "..."
        3. Expected an MP4; got a 500 with `RuntimeError: ...`
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / stack trace
      description: Paste the stderr / log output. Redact API keys.
      render: shell

  - type: input
    id: mode
    attributes:
      label: Video mode
      description: short / standard / course / lecture / unknown
      placeholder: standard

  - type: input
    id: provider
    attributes:
      label: LLM provider
      description: Which `STREAM_PROVIDER` / model were you using?
      placeholder: openai (gpt-4o)

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        - OS + version
        - Python version (`python --version`)
        - Manim version (`manim --version`)
        - ffmpeg version (`ffmpeg -version | head -1`)
        - NIMA commit SHA (`git rev-parse --short HEAD`)
      render: shell
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, MP4s, reproducing prompt, config tweaks — anything you think helps.
