# Pre-commit hooks for NIMA.
# Install: pip install pre-commit && pre-commit install
# Run on demand: pre-commit run --all-files
#
# The repository does not currently run hosted CI — these hooks plus a
# manual `ruff check .` and `pytest tests/` are the automated gate before
# review. Bump pins on a release cadence.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Pinned so pre-commit output is reproducible across contributor
    # machines. Bump alongside ruff config changes in `pyproject.toml`.
    rev: v0.15.6
    hooks:
      - id: ruff
        args: [--fix]
      # No `ruff-format` yet — the codebase isn't formatter-clean and we
      # don't want a giant reformatting commit hidden in someone's PR.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        # Markdown is allowed to have trailing 2-space line breaks; skip it.
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=2048]   # block accidentally committing renders/datasets
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
