name: Tests and Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  test:
    name: Pytest
    runs-on: ubuntu-latest
    env:
      USE_DATABASE: 'false'
      OPENAI_API_KEY: 'test'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run pytest
        # Heavy live-backend reliability harnesses now live under scripts/
        # (scripts/reliability_streaming.py, scripts/reliability_edge_cases.py)
        # and are not collected by pytest.
        run: pytest tests/ -q

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install linting tools
        run: pip install ruff

      - name: Run ruff
        run: ruff check . --ignore=E501,F401

  pipeline-modes:
    name: Pipeline mode smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [DRAFT, FAST, FULL]
    env:
      USE_DATABASE: 'false'
      OPENAI_API_KEY: 'test'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify config loads in ${{ matrix.mode }} mode
        env:
          DRAFT_PIPELINE: ${{ matrix.mode == 'DRAFT' }}
          FAST_PIPELINE: ${{ matrix.mode == 'FAST' }}
        run: |
          python -c "import config; print(f'DRAFT={config.DRAFT_PIPELINE}, FAST={config.FAST_PIPELINE}')"

  benchmark:
    name: Benchmark (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    env:
      USE_DATABASE: 'false'
      OPENAI_API_KEY: 'test'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run benchmark
        run: python scripts/benchmark.py

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.json
