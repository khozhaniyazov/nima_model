[tool.ruff]
# Sources of truth for ruff config — keeps CI and local runs aligned.
line-length = 120
target-version = "py311"

# Skip vendored / generated / non-Python content.
extend-exclude = [
    "training",        # 3b1b animation training corpus (vendored)
    "RAG/3b1b",        # 3b1b RAG corpus (vendored)
    "skills",          # agentic skill bundles (vendored)
    "nima-frontend",   # Next.js app
    "outputs",         # render outputs
    "media",           # render media
    ".tmp",            # scratch
    ".planning",       # markdown plans
    "docs",            # docs
]

[tool.ruff.lint]
# Practical rule set for this codebase. We can tighten later.
select = ["E", "F", "W"]
ignore = [
    "E501",  # line too long; we wrap when it helps readability
    "F401",  # unused import; many test/stub files keep imports for symmetry
    "E741",  # ambiguous variable name (used intentionally in some math code)
    "E731",  # lambda assignment (occasional readability win)
    "E402",  # module-level import not at top of file (used for dotenv/config bootstraps)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F841", "E712"]  # tests sometimes assert True/False explicitly and keep handles

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
